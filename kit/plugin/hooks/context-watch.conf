# H6 thresholds (tokens / minutes). Tune here; no settings change needed.
# This file is PARSED, never sourced: only these four keys, digits only; anything else is ignored.
WARN_AT=150000   # first "wrap up" notice
STEP=100000      # repeat every further 100k
IDLE_MIN=55      # resume after this long idle = full cache re-write (1 h cache TTL)...
IDLE_CTX=60000   # ...noticed only when the context is at least this big
